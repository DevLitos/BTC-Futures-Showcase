[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrader"
version = "2.1.0"
description = "BTC Perpetual Futures Trading Bot - Production Ready"
readme = "docs/README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.10.0",
    "aiohttp>=3.9.0",
    "ccxt>=4.0.0",
    "fastapi>=0.109.0",
    "ib-insync>=0.9.86",
    "kafka-python>=2.0.0",
    "numba>=0.59.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polygon-api-client>=1.13.0",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-telegram-bot>=21.0",
    "sqlalchemy>=2.0.0",
    "ta-lib>=0.4.28",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "ruff>=0.3.0",
    "pyright>=1.1.408",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools]
packages = ["src", "src.engine", "src.ingest", "src.storage", "src.monitoring", "src.core", "src.accounting", "src.strategy", "src.validation", "src.modes", "src.output"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pyright]
include = ["src", "main.py"]
exclude = [
    "deprecated",
    "tests",
    "tools",
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "docs",
    "**/_archived",
    "**/src/engine/_archived",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
