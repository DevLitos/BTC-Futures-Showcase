[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrader"
version = "2.1.0"
description = "BTC Perpetual Futures Trading Bot - Production Ready"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12.0",
    "ccxt>=4.5.21",
    "fastapi>=0.122.0",
    "ib-insync>=0.9.86",
    "kafka-python>=2.3.0",
    "numba>=0.62.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "polygon-api-client>=1.16.3",
    "prometheus-client>=0.23.1",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=22.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "python-telegram-bot>=22.5",
    "sqlalchemy>=2.0.44",
    "ta-lib>=0.6.8",
    "uvicorn[standard]>=0.38.0",
    "websockets>=15.0.1",
    "ruff>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools]
packages = ["engine", "ingest", "output", "storage", "monitoring", "core", "accounting", "strategy", "validation"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
