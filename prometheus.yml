# prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'trading_app'
    static_configs:
      # 'host.docker.internal' es una dirección especial que permite a un contenedor
      # Docker comunicarse con la máquina anfitriona (donde correrá tu script de Python).
      - targets: ['host.docker.internal:8000'] 
