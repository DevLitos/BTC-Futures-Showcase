# ============================================================
# DayTrader 2.1 - Production Docker Compose
# LIVE TRADING - Use with caution
# ============================================================
# 
# JUSTIFICACIÓN DE ARQUITECTURA:
# - Kafka: OPCIONAL (profile 'full'). Solo si necesitas replay/audit trail.
#   Para bot simple, el WebSocket directo es suficiente.
# - Prometheus/Grafana: Recomendado para observabilidad.
# - Sin Kafka: más simple, menos latencia, menos puntos de fallo.
#
# PERFILES:
#   docker compose up                    → Solo bot + monitoring (RECOMENDADO)
#   docker compose --profile full up     → Con Kafka (si lo necesitas)
#
# ============================================================

services:
  # ============================================================
  # TRADING BOT - Main Application
  # ============================================================
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: daytrader:${VERSION:-latest}
    container_name: daytrader-bot
    restart: unless-stopped
    
    # ⚠️ SECRETOS: Usar archivo separado con permisos 600
    env_file:
      - .env.secrets
    
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      # LIVE MODE POR DEFECTO
      - TRADING_MODE=${TRADING_MODE:-LIVE}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - METRICS_PORT=8000
      - HEALTH_PORT=8001
      # Time sync validation
      - MAX_TIME_DRIFT_MS=${MAX_TIME_DRIFT_MS:-500}
    
    volumes:
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./config:/app/config:ro
      - ./KILL_SWITCH:/app/KILL_SWITCH:ro
      # Host time sync (read-only)
      - /etc/localtime:/etc/localtime:ro
    
    # Sin dependencia de Kafka por defecto
    depends_on:
      prometheus:
        condition: service_started
    
    # Health check OPERATIVO (no solo técnico)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    
    # LÍMITES DE RECURSOS - CRÍTICO para trading
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.25'
          memory: 512M
    
    # Logging con rotación REAL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    
    # Límites del sistema
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    
    # Seguridad adicional
    security_opt:
      - no-new-privileges:true
    read_only: false
    
    networks:
      - trading-network

  # ============================================================
  # MONITORING - Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=1GB'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - trading-network

  # ============================================================
  # MONITORING - Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-dashboard.json:/var/lib/grafana/dashboards/trading.json:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - trading-network

  # ============================================================
  # KAFKA STACK - OPCIONAL (profile: full)
  # Solo si necesitas: replay, audit trail, múltiples consumers
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    profiles: ["full"]
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - trading-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - trading-network

  # ============================================================
  # SCHEDULED RESTART - OPCIONAL (profile: full)
  # ============================================================
  restart-scheduler:
    image: docker:24-cli
    container_name: restart-scheduler
    profiles: ["full"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Restart scheduler started"
        while true; do
          sleep 86400
          echo "Daily restart at $$(date -u)"
          docker restart daytrader-bot || true
        done
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    networks:
      - trading-network

# ============================================================
# VOLUMES & NETWORKS
# ============================================================
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  trading-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
